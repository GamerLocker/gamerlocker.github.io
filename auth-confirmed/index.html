<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#10131d" />
  <meta name="referrer" content="no-referrer" />
  <title>Conta confirmada • GamerLocker</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#090b11;--panel:#121621;--line:#2b3140;--text:#f4f1ff;
      --muted:#a3a9b8;--accent:#b3a5ff;--accent2:#7561eb;
      --ok:#61e7a7;--bad:#ff7185;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;
      font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);
      background:
        radial-gradient(circle at 50% -8%,rgba(120,91,255,.25),transparent 38%),
        linear-gradient(180deg,#0d1018,#080a0f 75%);
    }
    .card{
      width:min(650px,100%);padding:42px;border-radius:26px;text-align:center;
      background:linear-gradient(150deg,rgba(34,29,62,.76),rgba(18,22,33,.96) 46%,rgba(12,15,23,.99));
      border:1px solid var(--line);
      box-shadow:0 30px 90px rgba(0,0,0,.48),0 0 48px rgba(117,97,235,.10);
    }
    .icon{
      width:86px;height:86px;border-radius:25px;margin:0 auto 20px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,rgba(97,231,167,.20),rgba(117,97,235,.24));
      border:1px solid rgba(97,231,167,.34);
      box-shadow:0 18px 48px rgba(97,231,167,.10);
      font-size:42px;font-weight:900;color:var(--ok);
    }
    .icon.error{color:var(--bad);border-color:rgba(255,113,133,.38);background:rgba(255,113,133,.10)}
    h1{font-size:31px;margin:0 0 12px}
    p{color:var(--muted);line-height:1.62;margin:0 auto;max-width:510px}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
    button,a.button{
      border:0;min-height:48px;padding:0 20px;border-radius:14px;
      display:inline-flex;align-items:center;justify-content:center;
      font:inherit;font-weight:800;text-decoration:none;cursor:pointer;
    }
    .primary{background:linear-gradient(135deg,var(--accent),#9280ff);color:#171326}
    .secondary{background:#1a1f2b;color:#ded9ff;border:1px solid #353b4b!important}
    .note{
      margin-top:25px;padding:14px 16px;border-radius:14px;text-align:left;
      background:rgba(9,11,17,.54);border:1px solid #282e3b;font-size:13px;color:#8991a2;
    }
    .hidden{display:none!important}
    .brand{margin-top:26px;color:#6f7687;font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <div id="statusIcon" class="icon">✓</div>
    <h1 id="title">E-mail confirmado</h1>
    <p id="message">Sua conta GamerLocker foi confirmada com sucesso. Você já pode entrar normalmente no aplicativo.</p>

    <div id="desktopActions" class="actions">
      <a class="button primary" href="gamerlocker://auth-confirmed/">Abrir GamerLocker</a>
      <a class="button secondary" href="https://github.com/GamerLocker/gamerlocker-releases/releases">Downloads</a>
    </div>

    <div id="mobileNote" class="note hidden">
      Você confirmou a conta pelo celular. Tudo certo: volte ao seu computador e entre normalmente no GamerLocker.
    </div>

    <div id="errorNote" class="note hidden"></div>

    <div class="brand">GamerLocker • confirmação segura de conta</div>
  </main>

  <script>
    (() => {
      const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
      const query = new URLSearchParams(location.search);
      const error = hash.get('error') || query.get('error');
      const errorCode = hash.get('error_code') || query.get('error_code');
      const errorDescription =
        hash.get('error_description') ||
        query.get('error_description') ||
        'O link pode ter expirado ou já ter sido utilizado.';

      const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

      if (error || errorCode) {
        const icon = document.getElementById('statusIcon');
        icon.textContent = '!';
        icon.classList.add('error');
        document.getElementById('title').textContent = 'Não foi possível confirmar';
        document.getElementById('message').textContent =
          'O GamerLocker não conseguiu concluir esta confirmação.';
        document.getElementById('desktopActions').classList.add('hidden');

        const note = document.getElementById('errorNote');
        note.textContent = decodeURIComponent(errorDescription.replace(/\+/g, ' '));
        note.classList.remove('hidden');
      } else if (isMobile) {
        document.getElementById('desktopActions').classList.add('hidden');
        document.getElementById('mobileNote').classList.remove('hidden');
      }

      // A confirmação já aconteceu no Supabase antes do redirect.
      // Remove tokens/códigos da barra de endereço e do histórico do navegador.
      if (location.search || location.hash) {
        history.replaceState(null, document.title, location.pathname);
      }
    })();
  </script>
</body>
</html>
